# Netlify deployment configuration.
#
# The app is a static single-page application with no backend — the build
# output in dist/ is the whole deployment.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing: every path that is not a real file must serve
# index.html, or a deep link like /candidates/abc123 returns a 404 on reload.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets never change under the same name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must always be revalidated so a new deploy is picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # The app holds candidate personal data. Framing is denied so it cannot be
    # clickjacked, and connect-src is pinned to this origin plus Supabase — the
    # only place candidate data may go, so a dependency cannot exfiltrate it
    # anywhere else. The Supabase entries are inert on local-only builds; drop
    # them if you never use a shared database. Google Fonts is the only other
    # external origin, and carries no application data.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
