name: Deploy to GitHub Pages

# Publishes the app to GitHub Pages. Pages serves the site from a
# subdirectory (/<repo>/) and cannot rewrite unknown paths to index.html, so
# the Pages build uses relative asset URLs and hash routing — see build:pages.
on:
  push:
    branches: [claude/designer-interview-assessment-o7bwxu, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a running one finish rather than publishing a
# half-uploaded site.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Configure Pages
        # enablement turns Pages on if the repository has never used it.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: echo "### Live at ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
