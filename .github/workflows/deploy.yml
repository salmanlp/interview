name: Deploy to Netlify

# Production deploys come from the repository's default branch; every other
# push and pull request gets its own preview URL.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for Netlify credentials
        id: creds
        env:
          TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # Only the auth token is required. Without a site id the deploy uses
          # --site-name, which creates the site on the first run and reuses it
          # afterwards, so there is nothing to set up in the Netlify UI.
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Netlify not configured::Add a NETLIFY_AUTH_TOKEN repository secret to enable deploys. Skipping."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs on every push, with or without Netlify credentials, so a broken
      # build is caught even when deploys are not configured.
      - name: Type-check and build
        run: npm run build

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Optional repository variables; sensible defaults if unset.
          SITE_NAME: ${{ vars.NETLIFY_SITE_NAME || 'uiux-interview-assessment' }}
          TEAM: ${{ vars.NETLIFY_TEAM }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail

          # Target an existing site by id when one is configured; otherwise name
          # it, which creates the site on the first deploy.
          TARGET=()
          if [ -n "${NETLIFY_SITE_ID:-}" ]; then
            TARGET=(--site "$NETLIFY_SITE_ID")
          else
            TARGET=(--site-name "$SITE_NAME")
            [ -n "${TEAM:-}" ] && TARGET+=(--team "$TEAM")
          fi

          PROD=()
          if [ "$IS_DEFAULT_BRANCH" = "true" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Deploying to production as ${NETLIFY_SITE_ID:-$SITE_NAME}"
            PROD=(--prod)
          else
            echo "Deploying a preview of ${NETLIFY_SITE_ID:-$SITE_NAME}"
          fi

          npx --yes netlify-cli@27 deploy "${PROD[@]}" "${TARGET[@]}" \
            --no-build --dir dist \
            --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME}" --json > deploy.json
          # `url` is the live site and is only present on production deploys;
          # `deploy_url` is the immutable per-deploy URL and is always present.
          URL=$(node -p "const d=require('./deploy.json'); d.url || d.deploy_url")
          LOGS=$(node -p "require('./deploy.json').logs || ''")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to [$URL]($URL)"
            [ -n "$LOGS" ] && echo "[Deploy logs]($LOGS)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the preview URL on the pull request
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.netlify.outputs.url }}';
            if (!url) return;
            const body = `Preview deploy for this pull request: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('Preview deploy for this pull request:'),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
